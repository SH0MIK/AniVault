name: fix-ios-player

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'iPhone fullscreen') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch iPhone fullscreen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/render/player-script.ts')
          text = path.read_text(encoding='utf-8')

          start = text.find('function renderIosPseudoFs() {')
          end = text.find('function enterIosPseudoFs() {', start)
          if start < 0 or end < 0:
              raise SystemExit('iOS fullscreen function markers not found')

          replacement = r'''function syncIosPseudoFsViewport() {
            if (!iosPseudoFs || !root) return;
            const vv = window.visualViewport;
            const width = Math.max(1, Math.round(vv?.width || window.innerWidth));
            const height = Math.max(1, Math.round(vv?.height || window.innerHeight));

            root.style.setProperty('position', 'fixed', 'important');
            root.style.setProperty('z-index', '2147483647', 'important');
            root.style.setProperty('inset', '0', 'important');
            root.style.setProperty('width', width + 'px', 'important');
            root.style.setProperty('height', height + 'px', 'important');
            root.style.setProperty('max-width', 'none', 'important');
            root.style.setProperty('max-height', 'none', 'important');
            root.style.setProperty('margin', '0', 'important');
            root.style.setProperty('border-radius', '0', 'important');
            root.style.setProperty('overflow', 'hidden', 'important');
            root.style.setProperty('transform', 'none', 'important');
            root.style.setProperty('transform-origin', 'center center', 'important');
            root.style.setProperty('box-sizing', 'border-box', 'important');
          }

          function renderIosPseudoFs() {
            syncIosPseudoFsViewport();
          }

          '''

          text = text[:start] + replacement + text[end:]

          text = text.replace("  renderIosPseudoFs();\n  lockScreenOrientation();", "  renderIosPseudoFs();")

          marker = "function toggleFs() {"
          if marker not in text:
              raise SystemExit('toggleFs marker not found')

          listeners = r'''const iosPseudoFsViewportHandler = () => {
            if (!iosPseudoFs) return;
            requestAnimationFrame(syncIosPseudoFsViewport);
          };
          window.addEventListener('resize', iosPseudoFsViewportHandler, { passive: true });
          window.addEventListener('orientationchange', iosPseudoFsViewportHandler, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', iosPseudoFsViewportHandler, { passive: true });
          }

          '''
          if 'const iosPseudoFsViewportHandler' not in text:
              text = text.replace(marker, listeners + marker, 1)

          path.write_text(text, encoding='utf-8')
          print('Patched iPhone pseudo fullscreen without CSS rotation.')
          PY

      - name: Verify patch
        run: |
          grep -n "function syncIosPseudoFsViewport" src/render/player-script.ts
          grep -n "transform', 'none'" src/render/player-script.ts
          if grep -n "rotate(90deg)" src/render/player-script.ts; then
            echo 'ERROR: iPhone fullscreen still contains CSS rotation'
            exit 1
          fi

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/player-script.ts .github/workflows/fix-ios-player.yml
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git commit -m 'fix: iPhone fullscreen orientation'
          git push
