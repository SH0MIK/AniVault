name: Build AniVault Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android presence branch
        uses: actions/checkout@v4
        with:
          ref: feat/discord-presence-bridge

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Verify Discord Social SDK AAR
        run: |
          set -e
          test -s android/app/libs/discord_partner_sdk.aar
          ls -lh android/app/libs/discord_partner_sdk.aar

      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon -PdiscordApplicationId=1505538731791093820

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AniVault-Android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
