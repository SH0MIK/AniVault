name: Apply iPhone fullscreen fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch iPhone pseudo fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/render/player-script.ts')
          s = p.read_text()

          old = """let iosPseudoFs = false;
let iosFsScrollY = 0;
let iosBodyStyles = null;"""
          new = """let iosPseudoFs = false;
let iosFsScrollY = 0;
let iosBodyStyles = null;
let iosFsParent = null;
let iosFsNextSibling = null;"""
          if old not in s:
              raise SystemExit('state block not found')
          s = s.replace(old, new, 1)

          old = """  iosPseudoFs = true;
  iosFsScrollY = window.scrollY || window.pageYOffset || 0;
  iosBodyStyles = document.body ? {"""
          new = """  iosPseudoFs = true;
  iosFsScrollY = window.scrollY || window.pageYOffset || 0;

  // iOS Safari can keep a fixed descendant trapped by an ancestor's
  // stacking/overflow/transform context. Move the whole player to body while
  // pseudo-fullscreen is active so it can truly cover the page.
  iosFsParent = root.parentNode;
  iosFsNextSibling = root.nextSibling;
  if (iosFsParent && document.body && root.parentNode !== document.body) {
    document.body.appendChild(root);
  }

  iosBodyStyles = document.body ? {"""
          if old not in s:
              raise SystemExit('enter block not found')
          s = s.replace(old, new, 1)

          old = """  root.style.removeProperty('transform');
  document.querySelectorAll('.vh-fs-enter').forEach(el => el.style.display = 'block');"""
          new = """  root.style.removeProperty('transform');

  // Put the player back exactly where it was before pseudo-fullscreen.
  if (iosFsParent) {
    if (iosFsNextSibling && iosFsNextSibling.parentNode === iosFsParent) {
      iosFsParent.insertBefore(root, iosFsNextSibling);
    } else {
      iosFsParent.appendChild(root);
    }
  }
  iosFsParent = null;
  iosFsNextSibling = null;

  document.querySelectorAll('.vh-fs-enter').forEach(el => el.style.display = 'block');"""
          if old not in s:
              raise SystemExit('exit block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patched player and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/render/player-script.ts .github/workflows/ios-fullscreen-fix.yml
          git rm .github/workflows/ios-fullscreen-fix.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix: escape iPhone fullscreen stacking context"
          git push