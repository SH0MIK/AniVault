name: One-shot iPhone fullscreen fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/render/player-script.ts')
          s = p.read_text()
          if 'let iosFsParent = null;' in s:
              print('already patched')
              raise SystemExit(0)
          s = s.replace(
              "let iosPseudoFs = false;\nlet iosFsScrollY = 0;\nlet iosBodyStyles = null;",
              "let iosPseudoFs = false;\nlet iosFsScrollY = 0;\nlet iosBodyStyles = null;\nlet iosFsParent = null;\nlet iosFsNextSibling = null;",
              1
          )
          s = s.replace(
              "  iosPseudoFs = true;\n  iosFsScrollY = window.scrollY || window.pageYOffset || 0;\n  iosBodyStyles = document.body ? {",
              "  iosPseudoFs = true;\n  iosFsScrollY = window.scrollY || window.pageYOffset || 0;\n\n  // Escape ancestor stacking/overflow/transform contexts on iPhone.\n  iosFsParent = root.parentNode;\n  iosFsNextSibling = root.nextSibling;\n  if (iosFsParent && document.body && root.parentNode !== document.body) {\n    document.body.appendChild(root);\n  }\n\n  iosBodyStyles = document.body ? {",
              1
          )
          s = s.replace(
              "  root.style.removeProperty('transform');\n  document.querySelectorAll('.vh-fs-enter').forEach(el => el.style.display = 'block');",
              "  root.style.removeProperty('transform');\n\n  // Restore the player to its exact original DOM position.\n  if (iosFsParent) {\n    if (iosFsNextSibling && iosFsNextSibling.parentNode === iosFsParent) {\n      iosFsParent.insertBefore(root, iosFsNextSibling);\n    } else {\n      iosFsParent.appendChild(root);\n    }\n  }\n  iosFsParent = null;\n  iosFsNextSibling = null;\n\n  document.querySelectorAll('.vh-fs-enter').forEach(el => el.style.display = 'block');",
              1
          )
          p.write_text(s)
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/render/player-script.ts
          git rm .github/workflows/ios-fullscreen-fix.yml
          git commit -m 'fix: escape iPhone fullscreen stacking context'
          git push