name: Hoshika migration typecheck

on:
  push:
    branches:
      - migration/hoshika-only
  pull_request:
    branches:
      - migration/hoshika-only
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build Worker bundle without deploying
        run: npx wrangler deploy --dry-run
